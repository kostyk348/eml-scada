[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eml-scada"
version = "1.0.0"
description = "SCADA stack on mime-os: historian, station container, MIME bus and alarms — everything is .eml"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Konstantin", email = "kostyk348@users.noreply.github.com" }]
keywords = ["scada", "mime", "eml", "telemetry", "mime-os", "hash-chain"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: System :: Monitoring",
  "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]
dependencies = ["nicegui>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
eml-scada = "scada.run:main"

[project.urls]
Homepage = "https://github.com/kostyk348/eml-scada"
Platform = "https://github.com/kostyk348/mime-os"

[tool.setuptools.packages.find]
include = ["scada*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: требует собранный emlbox из mime-os (EMLBOX или target/release)",
]
