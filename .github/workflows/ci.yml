name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  unit:
    name: unit (no emlbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - name: Byte-compile all sources
        run: python -m compileall -q scada tests
      - run: python -m pytest -m "not integration"

  integration:
    name: integration (emlbox from mime-os)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Пинуем известную рабочую ревизию mime-os: 22f1315 (то, на чём гоняются
      # тесты). master mime-os на момент релиза не собирается на Linux
      # (E0716 в src/main.rs), поэтому «просто master» в CI — красный job.
      # Обновляя пин, прогони: cargo build --release + python -m pytest.
      - name: clone mime-os (pinned)
        run: |
          git init "$RUNNER_TEMP/mime-os"
          git -C "$RUNNER_TEMP/mime-os" remote add origin https://github.com/kostyk348/mime-os.git
          git -C "$RUNNER_TEMP/mime-os" fetch --depth 1 origin 22f131595ce258540a4efe0f4c5308df03e9bbe0
          git -C "$RUNNER_TEMP/mime-os" checkout --detach FETCH_HEAD
      - name: build emlbox
        run: cargo build --release --manifest-path "$RUNNER_TEMP/mime-os/Cargo.toml"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
        env:
          EMLBOX: ${{ runner.temp }}/mime-os/target/release/emlbox
      - name: tamper-evident demo
        run: |
          python -m scada.run headless --store "$RUNNER_TEMP/store" --seconds 8 --json
          python -m scada.run demo --store "$RUNNER_TEMP/store"
        env:
          EMLBOX: ${{ runner.temp }}/mime-os/target/release/emlbox
